<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%9A%9A%3C/text%3E%3C/svg%3E">
<title>Diferencias de líquido y envases</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --paper:#EEF1EE; --surface:#FFFFFF; --ink:#17201C; --muted:#5A6862; --line:#D3DAD5; --line-soft:#E4E9E5;
  --bottle:#1D5A42; --bottle-ink:#FFFFFF; --amber:#A8620E; --amber-soft:#F6E7D2;
  --falt:#B42318; --sobr:#1B5E86; --zebra:#F6F8F6; --focus:#A8620E;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --cond:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#111714; --surface:#18201C; --ink:#E4EBE7; --muted:#95A59D; --line:#2C3833; --line-soft:#222C28;
    --bottle:#5DB08A; --bottle-ink:#0D1411; --amber:#E2A24E; --amber-soft:#3A2C18;
    --falt:#F2786D; --sobr:#6DB5E6; --zebra:#1C2521; --focus:#E2A24E;
  }
}
:root[data-theme="dark"]{
  --paper:#111714; --surface:#18201C; --ink:#E4EBE7; --muted:#95A59D; --line:#2C3833; --line-soft:#222C28;
  --bottle:#5DB08A; --bottle-ink:#0D1411; --amber:#E2A24E; --amber-soft:#3A2C18;
  --falt:#F2786D; --sobr:#6DB5E6; --zebra:#1C2521; --focus:#E2A24E;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* Cabecera */
.top{background:var(--bottle);color:var(--bottle-ink);padding:14px 22px 0}
.top-row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;justify-content:space-between}
.brand h1{font:700 26px/1.05 var(--cond);margin:0;letter-spacing:.2px}
.brand p{margin:4px 0 0;font-size:13.5px;opacity:.85}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.store{font-size:12.5px;opacity:.9;padding:4px 10px;border:1px solid currentColor;border-radius:999px;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#fff}
.top .btn{background:transparent;color:var(--bottle-ink);border-color:currentColor}
.top .btn.primary{background:var(--bottle-ink);color:var(--bottle);border-color:var(--bottle-ink)}
.btn.danger{color:var(--falt)}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}

/* Pestañas en la cabecera */
.tabs{display:flex;gap:2px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:var(--bottle-ink);opacity:.78;padding:9px 16px 10px;font:600 15px var(--cond);cursor:pointer;border-radius:6px 6px 0 0;white-space:nowrap}
.tab:hover{opacity:1}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink);opacity:1}
.tab .count{font:500 12px var(--sans);margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--amber-soft);color:var(--amber)}

/* Filtros */
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--paper)}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label{font-size:12.5px;color:var(--muted)}
.field select,.field input{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:0}
.field.grow{flex:1 1 220px}
.field select{max-width:280px}

main{padding:20px 22px 60px;max-width:1500px}
.view[hidden]{display:none}
h2{font:700 21px/1.2 var(--cond);margin:0 0 4px}
h3{font:600 17px/1.2 var(--cond);margin:26px 0 8px}
.lead{color:var(--muted);margin:0 0 16px;max-width:75ch}

/* Franja de cifras */
.ledger{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border-top:3px solid var(--ink);border-bottom:1px solid var(--line);margin:6px 0 8px}
.ledger > div{padding:12px 16px 14px;border-left:1px solid var(--line)}
.ledger > div:first-child{border-left:0;padding-left:0}
.ledger .k{font-size:13px;color:var(--muted)}
.ledger .v{font:600 27px/1.15 var(--cond);margin-top:2px}
.ledger .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.pos{color:var(--falt)} .neg{color:var(--sobr)}

/* Tablas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 9px;text-align:left;border-bottom:1px solid var(--line-soft);vertical-align:middle;white-space:nowrap}
thead th{position:sticky;top:0;background:var(--surface);font:600 13px var(--cond);color:var(--muted);border-bottom:1px solid var(--line);z-index:1}
thead tr.grp th{font-size:12.5px;text-align:center;border-bottom:0;padding-bottom:0}
tbody tr:nth-child(even){background:var(--zebra)}
td.n,th.n{text-align:right}
tfoot td{font-weight:600;border-top:2px solid var(--ink);background:var(--surface)}
td.mat{white-space:normal;min-width:210px;max-width:320px}
td .sub{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
td select,td input{border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:3px 6px;font-size:13px}
td select{max-width:190px}
td input.com{width:200px}
td input.money{width:96px;text-align:right}
tr.unset td.cls select{border-color:var(--amber);background:var(--amber-soft)}
td.cf{background:#FBE3E0;color:#9B1C12}
td.cs{background:#DDF1E4;color:#15643D}
tfoot td.cf{background:#F6CFCA} tfoot td.cs{background:#C8E8D3}
h2.blk{margin:34px 0 0;padding-left:12px;border-left:5px solid var(--amber)}
h2.blk.liq{border-left-color:var(--bottle)}
h2.blk + .two h3{margin-top:12px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) td.cf{background:#4A1C18;color:#FFB4AB}:root:not([data-theme="light"]) td.cs{background:#15392A;color:#8FDCB0}}
:root[data-theme="dark"] td.cf{background:#4A1C18;color:#FFB4AB} :root[data-theme="dark"] td.cs{background:#15392A;color:#8FDCB0}
.slicers{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px;margin:4px 0 4px}
@media (max-width:860px){.slicers{grid-template-columns:1fr}}
.slicer{border:1px solid var(--line);border-top:3px solid var(--bottle);border-radius:8px;background:var(--surface);padding:8px 10px 10px}
.sl-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font:600 15px var(--cond);padding-bottom:6px;margin-bottom:8px;border-bottom:1px solid var(--line-soft)}
.sl-head em{font:400 12.5px var(--sans);color:var(--muted);font-style:normal;margin-left:6px}
.sl-clear{border:0;background:transparent;color:var(--amber);font-size:13px;cursor:pointer;padding:2px 4px}
.sl-clear:disabled{color:var(--muted);opacity:.5;cursor:default}
.sl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;max-height:112px;overflow-y:auto;padding-right:2px}
.sl-grid.fecha{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.sl-btn{border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:5px;padding:5px 8px;font-size:13.5px;cursor:pointer;text-align:left;font-variant-numeric:tabular-nums}
.sl-btn.on{background:var(--amber-soft);border-color:var(--amber);color:var(--ink);font-weight:500}
.sl-btn.nodata{opacity:.45}
.sl-btn:hover{border-color:var(--amber)}
.sl-empty{color:var(--muted);font-size:13px}
.sl-hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font:600 18px var(--cond);margin-bottom:6px}

.toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;margin:10px 0 12px}
.toolbar .note{font-size:13px;color:var(--muted);margin-left:auto}
.more{display:block;margin:12px auto 0}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:980px){.two{grid-template-columns:1fr}}

/* Carga */
.drop{border:2px dashed var(--line);border-radius:10px;padding:34px 20px;text-align:center;background:var(--surface);cursor:pointer}
.drop.over{border-color:var(--amber);background:var(--amber-soft)}
.drop strong{font:600 19px var(--cond);display:block;margin-bottom:4px}
.drop span{color:var(--muted);font-size:14px}
.log{margin-top:14px;border-left:3px solid var(--bottle);padding:8px 14px;background:var(--surface);border-radius:0 6px 6px 0;font-size:14px}
.log.err{border-left-color:var(--falt)}
.log p{margin:3px 0}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--sans)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin:4px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;font-size:14px;z-index:10;max-width:90vw}
.toast[hidden]{display:none}
.busy{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:20}
.busy[hidden]{display:none}
.busy div{background:var(--surface);color:var(--ink);padding:18px 24px;border-radius:10px;font-weight:500;max-width:80vw}
@media (max-width:640px){
  .top{padding:12px 14px 0} .filters{padding:12px 14px} main{padding:16px 14px 50px}
  .brand h1{font-size:22px} .ledger > div{padding-left:0;border-left:0;border-top:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand">
      <h1>Diferencias de líquido y envases</h1>
      <p id="subtitle">Carga tu reporte HELIO para empezar</p>
    </div>
    <div class="top-actions">
      <span class="store" id="storeBadge">Conectando…</span>
      <button class="btn" id="btnExport" type="button">Exportar a Excel</button>
      <button class="btn primary" id="btnUploadTop" type="button">Subir HELIO</button>
    </div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Secciones">
    <button class="tab" role="tab" data-view="resumen" aria-selected="true">Resumen</button>
    <button class="tab" role="tab" data-view="envases" aria-selected="false">Envases<span class="count" id="cntE" hidden></span></button>
    <button class="tab" role="tab" data-view="liquido" aria-selected="false">Líquido<span class="count" id="cntL" hidden></span></button>
    <button class="tab" role="tab" data-view="pagos" aria-selected="false">Envases pagados</button>
    <button class="tab" role="tab" data-view="helio" aria-selected="false">HELIO</button>
    <button class="tab" role="tab" data-view="motivos" aria-selected="false">Motivos</button>
  </nav>
</header>

<section class="filters" aria-label="Filtros">
  <div class="field"><label for="fEmp">Empresa</label><select id="fEmp"></select></div>
  <div class="field"><label for="fPer">Periodo</label><select id="fPer"></select></div>
  <div class="field"><label for="fFrom">Desde</label><input type="date" id="fFrom"></div>
  <div class="field"><label for="fTo">Hasta</label><input type="date" id="fTo"></div>
  <div class="field"><label for="fRuta">Ruta</label><select id="fRuta"></select></div>
  <div class="field"><label for="fUser">Tipo de pedido</label><select id="fUser"><option value="">Todos</option><option>Automático</option><option>Manual</option></select></div>
</section>

<main>
  <section class="view" id="v-resumen"></section>
  <section class="view" id="v-envases" hidden></section>
  <section class="view" id="v-liquido" hidden></section>
  <section class="view" id="v-pagos" hidden></section>
  <section class="view" id="v-helio" hidden></section>
  <section class="view" id="v-motivos" hidden></section>
</main>
<input type="file" id="fileIn" accept=".xlsx,.xls,.xlsm,.csv" multiple hidden>
<div class="toast" id="toast" role="status" hidden></div>
<div class="busy" id="busy" hidden><div id="busyMsg">Procesando…</div></div>
<script>
/* ===== Lógica pura: sin DOM ===== */
const R = {fecha:0,cond:1,nom:2,clase:3,tipo:4,idmat:5,mat:6,uni:7,imp:8,suni:9,simp:10,ruta:11,emp:12,ref:13,tdif:14,creado:15,nroped:16,tuser:17,placa:18};

function normH(s){
  return String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ');
}
function pad2(n){return (n<10?'0':'')+n;}
function serialToISO(n){
  const d=new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000);
  return d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(d.getUTCDate());
}
function parseDateAny(v){
  if(v==null||v==='') return '';
  if(typeof v==='number' && isFinite(v)) return serialToISO(v);
  if(v instanceof Date && !isNaN(v)){
    const d=new Date(v.getTime()+12*3600000);
    return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
  }
  const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return m[1]+'-'+pad2(+m[2])+'-'+pad2(+m[3]);
  m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/);
  if(m) return m[3]+'-'+pad2(+m[2])+'-'+pad2(+m[1]);
  if(/^\d{5}(\.\d+)?$/.test(s)) return serialToISO(parseFloat(s));
  return '';
}
function toNum(v){
  if(typeof v==='number') return isFinite(v)?v:0;
  if(v==null||v==='') return 0;
  let s=String(v).trim().replace(/\s/g,'');
  if(s.indexOf(',')>=0 && s.indexOf('.')>=0) s=s.replace(/,/g,'');
  else s=s.replace(',','.');
  const n=parseFloat(s);
  return isFinite(n)?n:0;
}
function str(v){
  if(v==null) return '';
  const s=String(v).trim();
  return s==='(en blanco)'?'':s;
}
function catType(c){
  const s=normH(c);
  if(s.indexOf('producto terminado')>=0) return 'L';
  if(s.indexOf('botell')>=0 || s.indexOf('plast')>=0) return 'E';
  return '';
}

/* Busca la fila de encabezados y arma el mapa de columnas */
const HELIO_FIELDS = {
  fecha:['fecha'], cond:['conductor'], nom:['nombre'], clase:['clase fac'], cat:['categoria'],
  idmat:['idmat'], mat:['material'], uni:['unidades'], imp:['importe'], suni:['s_unidades'],
  simp:['s_importe'], ruta:['ruta'], emp:['empresa'], ref:['referencia'], tdif:['tipo diferencia'],
  creado:['ped_creadopor'], nroped:['ped_nropedido'], tuser:['ped_tipouser'], placa:['placa']
};
const HELIO_REQUIRED = ['fecha','clase','cat','idmat','ruta','ref'];
const HELIO_LABEL = {fecha:'Fecha',clase:'Clase Fac',cat:'Categoria',idmat:'IDMat',ruta:'Ruta',ref:'Referencia'};

function findHeader(aoa, mustHave){
  const lim=Math.min(aoa.length,25);
  for(let i=0;i<lim;i++){
    const row=(aoa[i]||[]).map(normH);
    if(mustHave.every(h=>row.indexOf(h)>=0)) return {idx:i,row};
  }
  return null;
}

function parseHelioAOA(aoa){
  const h=findHeader(aoa,['clase fac','categoria']);
  if(!h) return {error:'No encontré los encabezados de HELIO (se necesitan columnas como "Clase Fac" y "Categoria").'};
  const col={};
  for(const k in HELIO_FIELDS){
    col[k]=-1;
    for(const name of HELIO_FIELDS[k]){ const j=h.row.indexOf(name); if(j>=0){col[k]=j;break;} }
  }
  const missing=HELIO_REQUIRED.filter(k=>col[k]<0).map(k=>HELIO_LABEL[k]);
  if(missing.length) return {error:'Faltan columnas en HELIO: '+missing.join(', ')+'.'};
  const g=(r,k)=>col[k]>=0?r[col[k]]:undefined;
  const rows=[]; let skipped=0, badDate=0;
  for(let i=h.idx+1;i<aoa.length;i++){
    const r=aoa[i]; if(!r) continue;
    const clase=str(g(r,'clase'));
    if(!clase){ continue; }
    const t=catType(g(r,'cat'));
    if(!t){ skipped++; continue; }
    const f=parseDateAny(g(r,'fecha'));
    if(!f){ badDate++; continue; }
    const row=new Array(19);
    row[R.fecha]=f; row[R.cond]=str(g(r,'cond')); row[R.nom]=str(g(r,'nom')); row[R.clase]=clase.toUpperCase();
    row[R.tipo]=t; row[R.idmat]=str(g(r,'idmat')); row[R.mat]=str(g(r,'mat'));
    row[R.uni]=toNum(g(r,'uni')); row[R.imp]=toNum(g(r,'imp')); row[R.suni]=toNum(g(r,'suni')); row[R.simp]=toNum(g(r,'simp'));
    row[R.ruta]=str(g(r,'ruta')); row[R.emp]=str(g(r,'emp')); row[R.ref]=str(g(r,'ref')); row[R.tdif]=str(g(r,'tdif'));
    row[R.creado]=str(g(r,'creado')); row[R.nroped]=str(g(r,'nroped')); row[R.tuser]=str(g(r,'tuser')); row[R.placa]=str(g(r,'placa'));
    rows.push(row);
  }
  return {rows,skipped,badDate};
}

/* Réplica de las columnas calculadas del Excel:
   Valor neto = ZPP4 -> Importe ; ZPD7 -> S_Importe * -1
   Unidades   = ZPP4 -> Unidades; ZPD7 -> s_Unidades * -1 */
function valorNeto(r){ return r[R.clase]==='ZPP4'?r[R.imp]:(r[R.clase]==='ZPD7'?-r[R.simp]:0); }
function unidNeto(r){ return r[R.clase]==='ZPP4'?r[R.uni]:(r[R.clase]==='ZPD7'?-r[R.suni]:0); }

function claseKey(r){
  return [r[R.fecha],r[R.cond],r[R.ruta],r[R.ref],r[R.idmat],r[R.tuser],r[R.nroped],r[R.creado]].join('|');
}

/* Tabla dinámica: filas Fecha > Conductor > Ruta > Referencia > IDMat > Material > TipoUser > NroPedido > CreadoPor,
   columnas Clase Fac (ZPD7 / ZPP4), valores Unidades y Valor neto */
function pivot(rows){
  const map=new Map();
  for(const r of rows){
    const k=claseKey(r);
    let p=map.get(k);
    if(!p){
      p={key:k,fecha:r[R.fecha],cond:r[R.cond],nom:r[R.nom],ruta:r[R.ruta],ref:r[R.ref],idmat:r[R.idmat],mat:r[R.mat],
         tuser:r[R.tuser],nroped:r[R.nroped],creado:r[R.creado],emp:r[R.emp],du:0,dv:0,pu:0,pv:0,tdif:{}};
      map.set(k,p);
    }
    if(r[R.clase]==='ZPD7'){ p.du+=unidNeto(r); p.dv+=valorNeto(r); }
    else if(r[R.clase]==='ZPP4'){ p.pu+=unidNeto(r); p.pv+=valorNeto(r); }
    if(r[R.tdif]) p.tdif[r[R.tdif]]=1;
  }
  const out=[...map.values()];
  for(const p of out){ p.tu=p.du+p.pu; p.tv=round2(p.dv+p.pv); p.dv=round2(p.dv); p.pv=round2(p.pv); }
  const cmp=(a,b)=>a<b?-1:a>b?1:0;
  out.sort((a,b)=>cmp(a.fecha,b.fecha)||cmp(a.cond,b.cond)||cmp(a.ruta,b.ruta)||cmp(a.ref,b.ref)||cmp(a.idmat,b.idmat)||cmp(a.tuser,b.tuser)||cmp(a.nroped,b.nroped));
  return out;
}
function round2(x){ return Math.round(x*100)/100; }

/* Periodos de liquidación: del 19 de un mes al 18 del siguiente */
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function cycleOf(iso){
  let y=+iso.slice(0,4), m=+iso.slice(5,7), d=+iso.slice(8,10);
  if(d<19){ m-=1; if(m<1){m=12;y-=1;} }
  const start=y+'-'+pad2(m)+'-19';
  let y2=y, m2=m+1; if(m2>12){m2=1;y2+=1;}
  const end=y2+'-'+pad2(m2)+'-18';
  return {id:y+'-'+pad2(m), start, end, label:'19 '+MESES[m-1]+' – 18 '+MESES[m2-1]+' '+y2};
}

/* Suma por Fecha + Ruta (base de Envases pagados) */
function porFechaRuta(piv){
  const m=new Map();
  for(const p of piv){
    const k=p.fecha+'|'+p.ruta;
    let o=m.get(k); if(!o){o={key:k,fecha:p.fecha,ruta:p.ruta,monto:0,lineas:0};m.set(k,o);}
    o.monto+=p.tv; o.lineas++;
  }
  const out=[...m.values()]; out.forEach(o=>o.monto=round2(o.monto));
  out.sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:(a.ruta<b.ruta?-1:a.ruta>b.ruta?1:0));
  return out;
}

/* Importa clasificaciones de RESUMEN ENVASES / RESUMEN LIQUIDO del Excel anterior */
function parseResumenAOA(aoa){
  const h=findHeader(aoa,['referencia','idmat','clase']);
  if(!h) return [];
  const ix=n=>h.row.indexOf(n);
  const c={fecha:ix('fecha'),cond:ix('conductor')>=0?ix('conductor'):ix('codigo'),ruta:ix('ruta'),ref:ix('referencia'),idmat:ix('idmat'),
    tuser:ix('ped_tipouser'),nroped:ix('ped_nropedido'),creado:ix('ped_creadopor'),clase:ix('clase'),motivo:ix('motivo'),com:ix('comentario')};
  const out=[];
  for(let i=h.idx+1;i<aoa.length;i++){
    const r=aoa[i]; if(!r) continue;
    const f=parseDateAny(r[c.fecha]); if(!f) continue;
    const code=c.clase>=0?r[c.clase]:null;
    const com=c.com>=0?str(r[c.com]):'';
    if((code==null||code==='')&&!com) continue;
    const key=[f,str(r[c.cond]),str(r[c.ruta]),str(r[c.ref]),str(r[c.idmat]),str(r[c.tuser]),str(r[c.nroped]),str(r[c.creado])].join('|');
    out.push({key,fecha:f,code:code==null||code===''?'':String(parseInt(code,10)||code),motivo:c.motivo>=0?str(r[c.motivo]):'',com});
  }
  return out;
}
/* Importa ENVASES PAGADOS (FECHA, RUTA, MONTO, PAGADO) */
function parsePagadosAOA(aoa){
  const h=findHeader(aoa,['fecha','ruta','pagado']);
  if(!h) return [];
  const fi=h.row.indexOf('fecha'), ri=h.row.indexOf('ruta'), pi=h.row.indexOf('pagado');
  const m=new Map();
  for(let i=h.idx+1;i<aoa.length;i++){
    const r=aoa[i]; if(!r) continue;
    const f=parseDateAny(r[fi]); const ruta=str(r[ri]);
    if(!f||!ruta) continue;
    const k=f+'|'+ruta;
    m.set(k,round2((m.get(k)||0)+toNum(r[pi])));
  }
  return [...m.entries()].map(([key,pagado])=>({key,fecha:key.slice(0,10),pagado}));
}
function parseAnexosAOA(aoa){
  const out=[];
  for(const r of aoa){
    if(!r) continue;
    const c=parseInt(r[0],10); const t=str(r[1]);
    if(c>0&&t) out.push({c,t});
  }
  return out;
}
if(typeof module!=='undefined') module.exports={R,parseHelioAOA,pivot,cycleOf,porFechaRuta,parseResumenAOA,parsePagadosAOA,parseAnexosAOA,valorNeto,parseDateAny};

</script>
<script>
/* ===================== Almacenamiento ===================== */
const Store = {
  db:null, idb:null, mode:'local',
  async init(){
    try{
      if(window.claude && typeof window.claude.use==='function'){
        const db = await window.claude.use('db');
        if(db){ this.db=db; this.mode='cloud'; return; }
      }
    }catch(e){}
    await this.openIdb();
  },
  openIdb(){
    return new Promise(res=>{
      try{
        const rq=indexedDB.open('dif-helio',1);
        rq.onupgradeneeded=()=>rq.result.createObjectStore('kv');
        rq.onsuccess=()=>{this.idb=rq.result;this.mode='local';res();};
        rq.onerror=()=>{this.mode='memory';res();};
      }catch(e){this.mode='memory';res();}
    });
  },
  mem:{},
  async retry(fn){
    try{ return await fn(); }
    catch(e){
      if(e && (e.code==='unavailable'||e.code==='resource_exhausted')){
        await new Promise(r=>setTimeout(r,700+Math.random()*900));
        return await fn();
      }
      throw e;
    }
  },
  async get(path){
    if(this.db){ const s=await this.retry(()=>this.db.doc(path).get()); return s.exists?s.data():null; }
    if(this.idb) return new Promise((res,rej)=>{const t=this.idb.transaction('kv').objectStore('kv').get(path);t.onsuccess=()=>res(t.result||null);t.onerror=()=>rej(t.error);});
    return this.mem[path]||null;
  },
  async set(path,obj){
    if(this.db) return this.retry(()=>this.db.doc(path).set(obj));
    if(this.idb) return new Promise((res,rej)=>{const tx=this.idb.transaction('kv','readwrite');tx.objectStore('kv').put(obj,path);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});
    this.mem[path]=obj;
  },
  async del(path){
    if(this.db) return this.retry(()=>this.db.doc(path).delete());
    if(this.idb) return new Promise((res,rej)=>{const tx=this.idb.transaction('kv','readwrite');tx.objectStore('kv').delete(path);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});
    delete this.mem[path];
  }
};

/* ===================== Estado ===================== */
const DEFAULT_ANEXOS=[
  {c:1,t:'DIF EN LIQUIDACION'},{c:2,t:'NETEADO'},{c:3,t:'MUESTREO'},{c:4,t:'SOBRANTE'},
  {c:5,t:'REGULARIZACIÓN DE ALMACEN PENDIENTE'},{c:6,t:'ROTURA'},{c:7,t:'FALTANTE ALMACEN NO RECONOCE'},{c:8,t:'RECLAMO DE BO'}
];
const PREFERRED_EMP='SEGURIDAD INDUSTRIAL SOPORTES LOGIS';
const S={
  meta:{days:[],empresas:[]},        // days: [[fecha, chunks, filas, subidoEn]]
  anexos:DEFAULT_ANEXOS.slice(),
  config:{empresa:''},
  dayCache:{},                        // fecha -> filas
  clases:{},                          // periodo -> Map(key -> [code, comentario])
  pagos:{},                           // periodo -> Map(fecha|ruta -> pagado)
  loadedCycles:{},
  view:'resumen',
  f:{per:'',from:'',to:'',ruta:'',user:''},
  env:[], liq:[], limit:{envases:250,liquido:250},
  q:{envases:{text:'',mot:'',sig:'',rutas:new Set(),fechas:new Set()},liquido:{text:'',mot:'',sig:'',rutas:new Set(),fechas:new Set()}},
  pagosOnlyPend:false
};

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtMoney=v=>{const n=Math.round((v||0)*100)/100; return (n<0?'−':'')+'S/ '+Math.abs(n).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});};
const fmtNum=v=>{const n=Math.round((v||0)*100)/100; return (n<0?'−':'')+Math.abs(n).toLocaleString('es-PE',{maximumFractionDigits:2});};
const sign=v=>v>0.004?'pos':(v<-0.004?'neg':'');
const fmtDate=iso=>iso?iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4):'';
function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3200);}
function busy(msg){ if(msg){$('busyMsg').textContent=msg;$('busy').hidden=false;} else $('busy').hidden=true; }
const tick=()=>new Promise(r=>setTimeout(r,0));

/* ===================== Carga de datos guardados ===================== */
async function loadBase(){
  const [meta,anx,cfg]=await Promise.all([Store.get('app/meta'),Store.get('app/anexos'),Store.get('app/config')]);
  if(meta&&Array.isArray(meta.days)) S.meta={days:meta.days,empresas:meta.empresas||[]};
  if(anx&&Array.isArray(anx.list)&&anx.list.length) S.anexos=anx.list;
  if(cfg) S.config=Object.assign(S.config,cfg);
}
async function saveMeta(){ await Store.set('app/meta',{days:S.meta.days,empresas:S.meta.empresas}); }
async function saveAnexos(){ await Store.set('app/anexos',{list:S.anexos}); }
async function saveConfig(){ await Store.set('app/config',S.config); }

async function ensureDays(from,to){
  const need=S.meta.days.filter(d=>d[0]>=from&&d[0]<=to&&!S.dayCache[d[0]]);
  for(let i=0;i<need.length;i+=6){
    await Promise.all(need.slice(i,i+6).map(async d=>{
      let rows=[];
      for(let c=0;c<d[1];c++){ const doc=await Store.get('helio/'+d[0]+'_'+c); if(doc&&doc.rows) rows=rows.concat(doc.rows); }
      S.dayCache[d[0]]=rows;
    }));
  }
  const cycles=new Set();
  S.meta.days.forEach(d=>{ if(d[0]>=from&&d[0]<=to) cycles.add(cycleOf(d[0]).id); });
  for(const cid of cycles) await ensureCycle(cid);
}
async function ensureCycle(cid){
  if(S.loadedCycles[cid]) return;
  const [c,p]=await Promise.all([Store.get('clases/'+cid),Store.get('pagos/'+cid)]);
  S.clases[cid]=new Map((c&&c.e)||[]);
  S.pagos[cid]=new Map((p&&p.e)||[]);
  S.loadedCycles[cid]=true;
}
const dirty={clases:new Set(),pagos:new Set()};
let saveTimer=null;
function markDirty(kind,cid){ dirty[kind].add(cid); clearTimeout(saveTimer); saveTimer=setTimeout(flushSaves,700); }
async function flushSaves(){
  const jobs=[];
  for(const cid of dirty.clases) jobs.push(Store.set('clases/'+cid,{e:[...S.clases[cid].entries()]}));
  for(const cid of dirty.pagos) jobs.push(Store.set('pagos/'+cid,{e:[...S.pagos[cid].entries()]}));
  dirty.clases.clear(); dirty.pagos.clear();
  try{ await Promise.all(jobs); }catch(e){ toast('No se pudo guardar el último cambio. Revisa tu conexión y vuelve a intentarlo.'); }
}
window.addEventListener('beforeunload',()=>{ if(dirty.clases.size||dirty.pagos.size) flushSaves(); });

function getClase(p){ const m=S.clases[cycleOf(p.fecha).id]; return (m&&m.get(p.key))||null; }
function setClase(p,code,com){
  const cid=cycleOf(p.fecha).id; if(!S.clases[cid]) S.clases[cid]=new Map();
  const m=S.clases[cid];
  if(!code&&!com) m.delete(p.key); else m.set(p.key,[code||'',com||'']);
  markDirty('clases',cid);
}
function motivoDe(code){ const a=S.anexos.find(x=>String(x.c)===String(code)); return a?a.t:''; }
function getPagado(fecha,ruta){ const m=S.pagos[cycleOf(fecha).id]; const v=m&&m.get(fecha+'|'+ruta); return v==null?null:v; }
function setPagado(fecha,ruta,v){
  const cid=cycleOf(fecha).id; if(!S.pagos[cid]) S.pagos[cid]=new Map();
  if(v===null) S.pagos[cid].delete(fecha+'|'+ruta); else S.pagos[cid].set(fecha+'|'+ruta,v);
  markDirty('pagos',cid);
}

/* ===================== Filtros y cálculo ===================== */
function cyclesAvailable(){
  const m=new Map();
  S.meta.days.forEach(d=>{const c=cycleOf(d[0]); m.set(c.id,c);});
  return [...m.values()].sort((a,b)=>a.id<b.id?1:-1);
}
function fillFilters(){
  const emps=S.meta.empresas.slice().sort();
  if(S.config.empresa!=='*' && (!S.config.empresa || (emps.length && emps.indexOf(S.config.empresa)<0))){
    S.config.empresa = emps.indexOf(PREFERRED_EMP)>=0 ? PREFERRED_EMP : (emps[0]||'');
  }
  $('fEmp').innerHTML='<option value="*">Todas las empresas</option>'+emps.map(e=>`<option ${e===S.config.empresa?'selected':''}>${esc(e)}</option>`).join('');
  if(S.config.empresa==='*') $('fEmp').value='*';
  const cyc=cyclesAvailable();
  if(!S.f.per || (S.f.per!=='custom' && !cyc.find(c=>c.id===S.f.per))){
    S.f.per=cyc[0]?cyc[0].id:'';
    if(cyc[0]){S.f.from=cyc[0].start;S.f.to=cyc[0].end;}
  }
  $('fPer').innerHTML=cyc.map(c=>`<option value="${c.id}">${c.label}</option>`).join('')+'<option value="custom">Rango personalizado</option>';
  $('fPer').value=S.f.per||'custom';
  $('fFrom').value=S.f.from; $('fTo').value=S.f.to;
  $('fUser').value=S.f.user;
}
function rowsInRange(){
  const out=[];
  for(const d of S.meta.days){
    if(d[0]<S.f.from||d[0]>S.f.to) continue;
    const rows=S.dayCache[d[0]]||[];
    for(const r of rows){
      if(S.config.empresa!=='*' && r[R.emp]!==S.config.empresa) continue;
      if(S.f.user && r[R.tuser]!==S.f.user) continue;
      out.push(r);
    }
  }
  return out;
}
function fillRutas(rows){
  const set=new Set(rows.map(r=>r[R.ruta]).filter(Boolean));
  const rutas=[...set].sort();
  if(S.f.ruta && !set.has(S.f.ruta)) S.f.ruta='';
  $('fRuta').innerHTML='<option value="">Todas</option>'+rutas.map(r=>`<option ${r===S.f.ruta?'selected':''}>${esc(r)}</option>`).join('');
}
async function recompute(){
  if(S.f.from&&S.f.to) await ensureDays(S.f.from,S.f.to);
  let rows=rowsInRange();
  fillRutas(rows);
  if(S.f.ruta) rows=rows.filter(r=>r[R.ruta]===S.f.ruta);
  S.env=pivot(rows.filter(r=>r[R.tipo]==='E'));
  S.liq=pivot(rows.filter(r=>r[R.tipo]==='L'));
  const emp=S.config.empresa==='*'?'Todas las empresas':(S.config.empresa||'Sin empresa');
  $('subtitle').textContent=S.meta.days.length?`${emp}, del ${fmtDate(S.f.from)} al ${fmtDate(S.f.to)}`:'Carga tu reporte HELIO para empezar';
  render();
}

/* ===================== Render ===================== */
function render(){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.view===S.view?'true':'false'));
  document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!=='v-'+S.view);
  const ue=S.env.filter(p=>!(getClase(p)||[])[0]).length, ul=S.liq.filter(p=>!(getClase(p)||[])[0]).length;

  ({resumen:renderResumen,envases:()=>renderDetalle('envases'),liquido:()=>renderDetalle('liquido'),pagos:renderPagos,helio:renderHelio,motivos:renderMotivos})[S.view]();
}
function emptyState(){
  return `<div class="empty"><strong>Aún no hay datos de HELIO</strong>Sube el Excel de HELIO (puede ser el reporte del día o el archivo completo del periodo) y todo se calcula solo.<br><br><button class="btn primary" type="button" onclick="pickFile()">Subir HELIO</button></div>`;
}
function sumBy(arr,f){ let s=0; for(const x of arr) s+=f(x); return Math.round(s*100)/100; }

function pagosResumen(){
  const fr=porFechaRuta(S.env).filter(o=>o.monto>0.004);
  let monto=0,pagado=0;
  for(const o of fr){ monto+=o.monto; const p=getPagado(o.fecha,o.ruta); pagado+=p||0; }
  return {fr,monto:Math.round(monto*100)/100,pagado:Math.round(pagado*100)/100};
}

function shade(v){ return v>0.004?'cf':(v<-0.004?'cs':''); }
function tdM(v,extra){ return `<td class="n ${shade(v)} ${extra||''}">${fmtMoney(v)}</td>`; }
function tablaRuta(data,conPagos,pr){
  const m=new Map();
  const get=r=>{r=r||'(sin ruta)';let o=m.get(r);if(!o){o={ruta:r,f:0,s:0,mo:0,pa:0};m.set(r,o);}return o;};
  data.forEach(p=>{const o=get(p.ruta); if(p.tv>0)o.f+=p.tv; else o.s+=p.tv;});
  if(conPagos) pr.fr.forEach(o=>{const x=get(o.ruta);x.mo+=o.monto;x.pa+=getPagado(o.fecha,o.ruta)||0;});
  const rows=[...m.values()].sort((a,b)=>a.ruta<b.ruta?-1:1);
  const T={f:0,s:0,mo:0,pa:0}; rows.forEach(o=>{T.f+=o.f;T.s+=o.s;T.mo+=o.mo;T.pa+=o.pa;});
  const head=`<tr><th>Ruta</th><th class="n">Faltante</th><th class="n">Sobrante</th><th class="n">Neto</th>${conPagos?'<th class="n">Pagado</th><th class="n">Pendiente</th>':''}</tr>`;
  const line=o=>`${tdM(o.f)}${tdM(o.s)}${tdM(o.f+o.s)}${conPagos?`<td class="n">${fmtMoney(o.pa)}</td>${tdM(o.mo-o.pa)}`:''}`;
  return `<div class="tbl-wrap"><table><thead>${head}</thead>
    <tbody>${rows.map(o=>`<tr><td>${esc(o.ruta)}</td>${line(o)}</tr>`).join('')||`<tr><td colspan="${conPagos?6:4}" class="empty">Sin diferencias en este rango</td></tr>`}</tbody>
    <tfoot><tr><td>Total</td>${line(T)}</tr></tfoot></table></div>`;
}
function tablaMotivo(data){
  const m=new Map();
  data.forEach(p=>{const c=(getClase(p)||[])[0]||'';let o=m.get(c);if(!o){o={c,name:c?(motivoDe(c)||'Clase '+c):'Sin clasificar',n:0,f:0,s:0};m.set(c,o);}o.n++;if(p.tv>0)o.f+=p.tv;else o.s+=p.tv;});
  const rows=[...m.values()].sort((a,b)=>(a.c===''?1:0)-(b.c===''?1:0)||(+a.c)-(+b.c));
  const T={n:0,f:0,s:0}; rows.forEach(o=>{T.n+=o.n;T.f+=o.f;T.s+=o.s;});
  const line=o=>`<td class="n">${o.n}</td>${tdM(o.f)}${tdM(o.s)}${tdM(o.f+o.s)}`;
  return `<div class="tbl-wrap"><table><thead><tr><th>Motivo</th><th class="n">Líneas</th><th class="n">Faltante</th><th class="n">Sobrante</th><th class="n">Neto</th></tr></thead>
    <tbody>${rows.map(o=>`<tr><td>${o.c?esc(o.c)+' ':''}${esc(o.name)}</td>${line(o)}</tr>`).join('')||'<tr><td colspan="5" class="empty">Sin líneas en este rango</td></tr>'}</tbody>
    <tfoot><tr><td>Total</td>${line(T)}</tr></tfoot></table></div>`;
}
function renderResumen(){
  const el=$('v-resumen');
  if(!S.meta.days.length){ el.innerHTML=emptyState(); return; }
  const eF=sumBy(S.env,p=>p.tv>0?p.tv:0), eS=sumBy(S.env,p=>p.tv<0?p.tv:0);
  const lF=sumBy(S.liq,p=>p.tv>0?p.tv:0), lS=sumBy(S.liq,p=>p.tv<0?p.tv:0);
  const pr=pagosResumen();
  const sinE=S.env.filter(p=>!(getClase(p)||[])[0]).length, sinL=S.liq.filter(p=>!(getClase(p)||[])[0]).length;
  const days=new Map();
  S.env.forEach(p=>{let o=days.get(p.fecha)||{e:0,l:0};o.e+=p.tv;days.set(p.fecha,o);});
  S.liq.forEach(p=>{let o=days.get(p.fecha)||{e:0,l:0};o.l+=p.tv;days.set(p.fecha,o);});
  const dd=[...days.entries()].sort((a,b)=>a[0]<b[0]?-1:1);
  el.innerHTML=`
  <div class="ledger">
    <div><div class="k">Envases, neto</div><div class="v ${sign(eF+eS)}">${fmtMoney(eF+eS)}</div><div class="s">Faltante ${fmtMoney(eF)}, sobrante ${fmtMoney(eS)}</div></div>
    <div><div class="k">Líquido, neto</div><div class="v ${sign(lF+lS)}">${fmtMoney(lF+lS)}</div><div class="s">Faltante ${fmtMoney(lF)}, sobrante ${fmtMoney(lS)}</div></div>
    <div><div class="k">Envases pagados</div><div class="v">${fmtMoney(pr.pagado)}</div><div class="s">de ${fmtMoney(pr.monto)} por pagar</div></div>
    <div><div class="k">Pendiente de pago</div><div class="v ${sign(pr.monto-pr.pagado)}">${fmtMoney(pr.monto-pr.pagado)}</div><div class="s">${pr.fr.filter(o=>(o.monto-(getPagado(o.fecha,o.ruta)||0))>0.004).length} días-ruta con saldo</div></div>
    <div><div class="k">Sin clasificar</div><div class="v">${sinE+sinL}</div><div class="s">${sinE} de envases y ${sinL} de líquido</div></div>
  </div>
  <p class="lead">En las tablas, rojo es faltante (se descuenta), verde es sobrante y sin color cuando está en cero.</p>

  <h2 class="blk env">Envases</h2>
  <div class="two">
    <div><h3>Por ruta</h3>${tablaRuta(S.env,true,pr)}</div>
    <div><h3>Por motivo</h3>${tablaMotivo(S.env)}</div>
  </div>
  <h2 class="blk liq">Líquido</h2>
  <div class="two">
    <div><h3>Por ruta</h3>${tablaRuta(S.liq,false,pr)}</div>
    <div><h3>Por motivo</h3>${tablaMotivo(S.liq)}</div>
  </div>`;
}
function chartDias(dd){
  if(!dd.length) return '<div class="empty"><strong>No hay movimientos en este rango</strong>Cambia el periodo o la empresa en los filtros.</div>';
  const W=Math.max(640,dd.length*34), H=190, pad=28, base=H/2+4;
  let max=0; dd.forEach(([,o])=>{max=Math.max(max,Math.abs(o.e),Math.abs(o.l));}); max=max||1;
  const bw=(W-pad*2)/dd.length, sc=(H/2-24)/max;
  let bars='';
  dd.forEach(([f,o],i)=>{
    const x=pad+i*bw;
    const he=Math.abs(o.e)*sc, hl=Math.abs(o.l)*sc, w=Math.max(3,bw*0.36);
    bars+=`<rect x="${x+bw*0.12}" y="${o.e>=0?base-he:base}" width="${w}" height="${Math.max(he,.5)}" fill="var(--amber)"><title>${fmtDate(f)} envases ${fmtMoney(o.e)}</title></rect>`;
    bars+=`<rect x="${x+bw*0.12+w+1}" y="${o.l>=0?base-hl:base}" width="${w}" height="${Math.max(hl,.5)}" fill="var(--bottle)"><title>${fmtDate(f)} líquido ${fmtMoney(o.l)}</title></rect>`;
    if(dd.length<=40||i%2===0) bars+=`<text x="${x+bw/2}" y="${H-4}" text-anchor="middle">${f.slice(8,10)}</text>`;
  });
  return `<h3>Diferencia neta por día</h3><div class="tbl-wrap" style="padding:8px 4px 2px"><svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="max-height:230px" role="img" aria-label="Diferencia neta diaria de envases y líquido">
  <line x1="${pad}" x2="${W-pad}" y1="${base}" y2="${base}" stroke="var(--line)"/>
  <text x="4" y="14">faltante</text><text x="4" y="${H-18}">sobrante</text>${bars}</svg></div>
  <div class="legend"><span><i style="background:var(--amber)"></i>Envases</span><span><i style="background:var(--bottle)"></i>Líquido</span><span>Arriba de la línea = faltante; abajo = sobrante</span></div>`;
}

/* ---- Detalle (réplica de ENVASES HE / LÍQUIDO HE + RESUMEN) ---- */
function filteredDetalle(kind){
  const data=kind==='envases'?S.env:S.liq, q=S.q[kind];
  const t=q.text.trim().toLowerCase();
  return data.filter(p=>{
    if(q.rutas.size&&!q.rutas.has(p.ruta||'(sin ruta)')) return false;
    if(q.fechas.size&&!q.fechas.has(p.fecha)) return false;
    if(q.sig==='f'&&!(p.tv>0.004)) return false;
    if(q.sig==='s'&&!(p.tv<-0.004)) return false;
    const c=(getClase(p)||[])[0]||'';
    if(q.mot==='__none'&&c) return false;
    if(q.mot&&q.mot!=='__none'&&c!==q.mot) return false;
    if(t){ const hay=(p.mat+' '+p.ref+' '+p.ruta+' '+p.cond+' '+p.nom+' '+p.idmat+' '+p.nroped).toLowerCase(); if(hay.indexOf(t)<0) return false; }
    return true;
  });
}
function claseOptions(sel){
  return '<option value="">Sin clase</option>'+S.anexos.map(a=>`<option value="${a.c}" ${String(a.c)===String(sel)?'selected':''}>${a.c} ${esc(a.t)}</option>`).join('');
}

function slicersHTML(kind){
  const data=kind==='envases'?S.env:S.liq, q=S.q[kind];
  const rutas=[...new Set(data.map(p=>p.ruta||'(sin ruta)'))].sort();
  const fechas=[...new Set(data.map(p=>p.fecha))].sort();
  // quitar selecciones que ya no existen (cambio de empresa o periodo)
  [...q.rutas].forEach(r=>{if(rutas.indexOf(r)<0)q.rutas.delete(r);});
  [...q.fechas].forEach(f=>{if(fechas.indexOf(f)<0)q.fechas.delete(f);});
  // disponibilidad cruzada, como en Excel
  const rutasCon=new Set(data.filter(p=>!q.fechas.size||q.fechas.has(p.fecha)).map(p=>p.ruta||'(sin ruta)'));
  const fechasCon=new Set(data.filter(p=>!q.rutas.size||q.rutas.has(p.ruta||'(sin ruta)')).map(p=>p.fecha));
  const btn=(type,val,label,sel,has)=>`<button type="button" class="sl-btn${sel?' on':''}${has?'':' nodata'}" data-sl="${type}" data-v="${esc(val)}" aria-pressed="${sel}">${esc(label)}</button>`;
  const box=(type,title,items,set,avail,fmt)=>`<div class="slicer">
    <div class="sl-head"><span>${title}${set.size?` <em>${set.size} de ${items.length}</em>`:''}</span>
    <button type="button" class="sl-clear" data-slclear="${type}" ${set.size?'':'disabled'} title="Borrar filtro de ${title.toLowerCase()}" aria-label="Borrar filtro de ${title.toLowerCase()}">Borrar filtro</button></div>
    <div class="sl-grid ${type}">${items.map(v=>btn(type,v,fmt(v),!set.size||set.has(v),avail.has(v))).join('')||'<span class="sl-empty">Sin datos</span>'}</div></div>`;
  return `<div class="slicers">${box('ruta','Ruta',rutas,q.rutas,rutasCon,v=>v)}${box('fecha','Fecha',fechas,q.fechas,fechasCon,fmtDate)}</div>
  <p class="sl-hint">Haz clic para filtrar; vuelve a hacer clic para quitar. Puedes marcar varias rutas y fechas a la vez.</p>`;
}
function bindSlicers(kind,el){

function renderPagos(){
  const el=$('v-pagos');
  if(!S.meta.days.length){ el.innerHTML=emptyState(); return; }

      <h3>Sobrantes por día y ruta</h3>
      <div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Ruta</th><th class="n">Monto</th></tr></thead>

  $('onlyPend').onchange=e=>{S.pagosOnlyPend=e.target.checked;renderPagos();};

    t.forEach(o=>setPagado(o.fecha,o.ruta,o.monto)); renderPagos();

function pickFile(){ $('fileIn').value=''; $('fileIn').click(); }

function sheetAOA(ws){
  // Recalcula el rango real (el Excel puede declarar 1.048.576 filas vacías)
  let maxR=0,maxC=0;
  for(const k in ws){ if(k[0]==='!') continue; const a=XLSX.utils.decode_cell(k); if(a.r>maxR)maxR=a.r; if(a.c>maxC)maxC=a.c; }
  ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:maxR,c:maxC}});
  return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:false});
}
async function handleFiles(files){
  if(!files||!files.length) return;
  const logs=[];
  for(const file of files){
    try{ logs.push(...await importFile(file)); }
    catch(e){ logs.push({err:true,t:`${file.name}: no se pudo leer (${e&&e.message?e.message:e}).`}); }
  }
  busy();
  lastLog=`<div class="log ${logs.some(l=>l.err)?'err':''}">${logs.map(l=>`<p>${esc(l.t)}</p>`).join('')}</div>`;
  fillFilters(); await recompute();
  if(S.view!=='helio'){ toast(logs.map(l=>l.t).join(' ')); }
}
async function importFile(file){
  const logs=[];
  busy(`Leyendo ${file.name}…`); await tick();
  const buf=await file.arrayBuffer();
  const isCsv=/\.csv$/i.test(file.name);
  let names;
  if(isCsv) names=null;
  else { const bk=XLSX.read(buf,{type:'array',bookSheets:true}); names=bk.SheetNames; }
  const nn=names?names.map(normH):[];
  const pick=pred=>names?names.filter((n,i)=>pred(nn[i])):[];
  const helioName=names?(pick(n=>n==='helio')[0]||pick(n=>n.indexOf('helio')>=0&&n.indexOf('env')<0&&n.indexOf('liq')<0)[0]||names[0]):null;
  const resNames=pick(n=>n.indexOf('resumen')===0);
  const pagName=pick(n=>n.indexOf('pagado')>=0)[0];
  const anxName=pick(n=>n==='anexos')[0];
  busy(`Procesando ${file.name}… (un archivo grande puede tardar unos segundos)`); await tick();
  const want=names?[helioName,...resNames,pagName,anxName].filter(Boolean):undefined;
  const wb=XLSX.read(buf,{type:'array',sheets:want,cellFormula:false,cellHTML:false,cellText:false,cellStyles:false});
  const ws=wb.Sheets[helioName||wb.SheetNames[0]];
  const parsed=parseHelioAOA(sheetAOA(ws));
  if(parsed.error){ logs.push({err:true,t:`${file.name}: ${parsed.error}`}); return logs; }
  if(!parsed.rows.length){ logs.push({err:true,t:`${file.name}: la hoja HELIO no tiene filas de envases ni de líquido.`}); return logs; }

  // Agrupar por fecha y guardar (reemplaza los días que vienen en el archivo)
  const byDay=new Map();
  parsed.rows.forEach(r=>{ if(!byDay.has(r[R.fecha])) byDay.set(r[R.fecha],[]); byDay.get(r[R.fecha]).push(r); });
  const fechas=[...byDay.keys()].sort();
  let i=0, replaced=0;
  for(const f of fechas){
    i++; busy(`Guardando ${fmtDate(f)} (${i} de ${fechas.length})…`); await tick();
    const rows=byDay.get(f);
    const chunks=[]; let cur=[], size=0;
    for(const r of rows){ const s=JSON.stringify(r).length; if(size+s>170000&&cur.length){chunks.push(cur);cur=[];size=0;} cur.push(r); size+=s; }
    if(cur.length) chunks.push(cur);
    const old=S.meta.days.find(d=>d[0]===f);
    if(old) replaced++;
    for(let c=0;c<chunks.length;c++) await Store.set('helio/'+f+'_'+c,{rows:chunks[c]});
    if(old) for(let c=chunks.length;c<old[1];c++) await Store.del('helio/'+f+'_'+c);
    S.meta.days=S.meta.days.filter(d=>d[0]!==f); S.meta.days.push([f,chunks.length,rows.length,Date.now()]);
    S.dayCache[f]=rows;
  }
  const emps=new Set(S.meta.empresas); parsed.rows.forEach(r=>{if(r[R.emp])emps.add(r[R.emp]);});
  S.meta.empresas=[...emps];
  S.meta.days.sort((a,b)=>a[0]<b[0]?-1:1);
  await saveMeta();
  logs.push({t:`${file.name}: ${parsed.rows.length.toLocaleString('es-PE')} filas de ${fechas.length} ${fechas.length===1?'día':'días'} (${fmtDate(fechas[0])}${fechas.length>1?' al '+fmtDate(fechas[fechas.length-1]):''})${replaced?`, ${replaced} ${replaced===1?'día reemplazado':'días reemplazados'}`:''}.`});
  if(parsed.badDate) logs.push({err:true,t:`${parsed.badDate} filas sin fecha válida se omitieron.`});

  // Motivos
  if(anxName){
    const ax=parseAnexosAOA(sheetAOA(wb.Sheets[anxName]));
    let n=0; ax.forEach(a=>{ if(!S.anexos.find(x=>+x.c===a.c)){S.anexos.push(a);n++;} });
    if(n){ S.anexos.sort((a,b)=>a.c-b.c); await saveAnexos(); logs.push({t:`Se agregaron ${n} motivos desde ANEXOS.`}); }
  }
  // Clases y comentarios del Excel anterior (solo rellena lo que aún no tiene clase)
  let nCls=0, newMot=0;
  for(const rn of resNames){
    const items=parseResumenAOA(sheetAOA(wb.Sheets[rn]));
    for(const it of items){
      const cid=cycleOf(it.fecha).id; await ensureCycle(cid);
      if(it.code && !S.anexos.find(a=>String(a.c)===it.code) && it.motivo && +it.code>0){ S.anexos.push({c:+it.code,t:it.motivo}); newMot++; }
      const m=S.clases[cid]; const cur=m.get(it.key);
      if(cur&&cur[0]) continue;
      m.set(it.key,[it.code,it.com||(cur?cur[1]:'')]); dirty.clases.add(cid); nCls++;
    }
  }
  if(newMot){ S.anexos.sort((a,b)=>a.c-b.c); await saveAnexos(); }
  // Pagos
  let nPag=0;
  if(pagName){
    for(const it of parsePagadosAOA(sheetAOA(wb.Sheets[pagName]))){
      const cid=cycleOf(it.fecha).id; await ensureCycle(cid);
      if(S.pagos[cid].has(it.key)) continue;
      S.pagos[cid].set(it.key,it.pagado); dirty.pagos.add(cid); nPag++;
    }
  }
  if(nCls||nPag){ busy('Guardando clases y pagos…'); await flushSaves(); }
  if(nCls) logs.push({t:`Se importaron ${nCls} clases y comentarios desde las hojas RESUMEN${newMot?` (y ${newMot} motivos nuevos)`:''}.`});
  if(nPag) logs.push({t:`Se importaron ${nPag} pagos desde ENVASES PAGADOS.`});
  // Mover el periodo al último día subido
  const c=cycleOf(fechas[fechas.length-1]); S.f.per=c.id; S.f.from=c.start; S.f.to=c.end;
  return logs;
}

/* ---- Motivos (ANEXOS) ---- */
function renderMotivos(){
  const el=$('v-motivos');
  el.innerHTML=`
  <h2>Motivos</h2>
  <p class="lead">Es tu hoja ANEXOS: el número que eliges en la columna Clase trae este motivo. Puedes cambiar los textos o agregar códigos nuevos.</p>
  <div class="tbl-wrap" style="max-width:640px"><table>
    <thead><tr><th style="width:90px">Clase</th><th>Motivo</th><th class="n">En uso</th><th></th></tr></thead>
    <tbody>${S.anexos.map((a,i)=>{const uses=countUses(a.c);return `<tr data-i="${i}"><td>${a.c}</td><td><input data-act="t" value="${esc(a.t)}" style="width:100%;min-width:220px" aria-label="Motivo ${a.c}"></td><td class="n">${uses}</td><td>${uses?'':`<button class="btn small danger" type="button" data-act="del">Quitar</button>`}</td></tr>`;}).join('')}</tbody>
  </table></div>
  <div class="toolbar" style="max-width:640px">
    <div class="field"><label for="nc">Clase</label><input id="nc" type="number" min="1" step="1" style="width:90px" value="${(S.anexos.reduce((m,a)=>Math.max(m,+a.c),0)||0)+1}"></div>
    <div class="field grow"><label for="nt">Motivo</label><input id="nt" placeholder="Ej. CORREO RECLAMO T77"></div>
    <button class="btn primary" type="button" id="addMot">Agregar motivo</button>
  </div>`;
  const tb=el.querySelector('tbody');
  tb.onchange=async e=>{ if(e.target.dataset.act!=='t') return; const i=+e.target.closest('tr').dataset.i; S.anexos[i].t=e.target.value.trim()||S.anexos[i].t; await saveAnexos(); toast('Motivo actualizado.'); };
  tb.onclick=async e=>{ if(e.target.dataset.act!=='del') return; const i=+e.target.closest('tr').dataset.i; S.anexos.splice(i,1); await saveAnexos(); renderMotivos(); };
  $('addMot').onclick=async()=>{
    const c=parseInt($('nc').value,10), t=$('nt').value.trim();
    if(!(c>0)||!t){toast('Escribe el número de clase y el motivo.');return;}
    if(S.anexos.find(a=>+a.c===c)){toast(`La clase ${c} ya existe; cambia su texto en la tabla.`);return;}
    S.anexos.push({c,t}); S.anexos.sort((a,b)=>a.c-b.c); await saveAnexos(); renderMotivos(); toast(`Motivo ${c} agregado.`);
  };
}
function countUses(code){
  let n=0; for(const cid in S.clases) for(const v of S.clases[cid].values()) if(String(v[0])===String(code)) n++; return n;
}

  const out=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  const name=`Diferencias ${fmtDate(S.f.from).replace(/\//g,'-')} al ${fmtDate(S.f.to).replace(/\//g,'-')}.xlsx`;

    catch(e){ if(e&&e.code!=='declined') toast('No se pudo exportar el Excel en esta vista.'); }

/* ===================== Reporte Excel con formato (ExcelJS) ===================== */
function loadExcelJS(){
  if(window.ExcelJS) return Promise.resolve(window.ExcelJS);
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
    s.onload=()=>window.ExcelJS?res(window.ExcelJS):rej(new Error('ExcelJS no disponible'));
    s.onerror=()=>rej(new Error('No se pudo cargar ExcelJS'));
    document.head.appendChild(s);
  });
}
const XC={green:'FF1D5A42',greenSoft:'FFE3EEE8',amber:'FFA8620E',amberSoft:'FFFBEEDC',zebra:'FFF5F8F6',line:'FFCBD5CF',ink:'FF17201C',muted:'FF5A6862',white:'FFFFFFFF',red:'FFB42318',blue:'FF1B5E86'};
const FMT={
  money:'"S/ "#,##0.00;-"S/ "#,##0.00;"–"',
  signed:'[Color10]"S/ "#,##0.00;[Blue]-"S/ "#,##0.00;"–"',
  diff:'[Red]"S/ "#,##0.00;[Blue]-"S/ "#,##0.00;"–"',
  units:'#,##0;-#,##0;"–"',
  int:'#,##0',
  date:'dd/mm/yyyy'
};
const colL=n=>{let s='';while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;};
const isoToDate=iso=>new Date(Date.UTC(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10)));
const thin={style:'thin',color:{argb:XC.line}};
const boxBorder={top:thin,left:thin,bottom:thin,right:thin};
const fill=argb=>({type:'pattern',pattern:'solid',fgColor:{argb}});

function newSheet(wb,name,tab,landscape=true){
  const ws=wb.addWorksheet(name,{properties:{tabColor:{argb:tab},defaultRowHeight:17},
    pageSetup:{paperSize:9,orientation:landscape?'landscape':'portrait',fitToPage:true,fitToWidth:1,fitToHeight:0,
      margins:{left:0.4,right:0.4,top:0.5,bottom:0.5,header:0.25,footer:0.25},horizontalCentered:true},
    views:[{showGridLines:false}]});
  ws.headerFooter.oddFooter='&L&8Diferencias de líquido y envases&R&8Página &P de &N';
  return ws;
}
function titleBlock(ws,title,ncols,startCol=1){
  const emp=S.config.empresa==='*'?'Todas las empresas':(S.config.empresa||'');
  const filtros=[S.f.ruta?'Ruta '+S.f.ruta:'Todas las rutas',S.f.user?'Pedidos '+S.f.user.toLowerCase()+'s':'Todos los pedidos'].join('  |  ');
  const lines=[
    [title,{size:17,bold:true,color:{argb:XC.green}},26],
    [emp,{size:11,bold:true,color:{argb:XC.ink}},18],
    [`Periodo: ${fmtDate(S.f.from)} al ${fmtDate(S.f.to)}   |   ${filtros}`,{size:10,color:{argb:XC.muted}},16],
    [`Generado el ${new Date().toLocaleString('es-PE',{dateStyle:'long',timeStyle:'short'})}`,{size:9,italic:true,color:{argb:XC.muted}},15]
  ];
  lines.forEach((l,i)=>{
    const r=i+1; ws.mergeCells(r,startCol,r,startCol+ncols-1);
    const c=ws.getCell(r,startCol); c.value=l[0]; c.font=Object.assign({name:'Calibri'},l[1]); c.alignment={vertical:'middle'};
    ws.getRow(r).height=l[2];
  });
  // línea de acento
  for(let c=startCol;c<startCol+ncols;c++) ws.getCell(4,c).border={bottom:{style:'medium',color:{argb:XC.amber}}};
  return 6;
}
function sectionTitle(ws,row,col,text,ncols){
  ws.mergeCells(row,col,row,col+ncols-1);
  const c=ws.getCell(row,col); c.value=text; c.font={name:'Calibri',size:12,bold:true,color:{argb:XC.green}};
  ws.getRow(row).height=20;
  return row+1;
}
function headRow(ws,row,col,labels,height=30){
  labels.forEach((h,i)=>{
    const c=ws.getCell(row,col+i); c.value=h;
    c.font={name:'Calibri',size:10,bold:true,color:{argb:XC.white}}; c.fill=fill(XC.green);
    c.alignment={vertical:'middle',horizontal:'center',wrapText:true}; c.border=boxBorder;
  });
  ws.getRow(row).height=height;
  return row+1;
}
function styleData(c,fmt,zebra,align){
  c.font={name:'Calibri',size:10,color:{argb:XC.ink}}; c.border=boxBorder;
  if(fmt) c.numFmt=fmt;
  if(zebra) c.fill=fill(XC.zebra);
  c.alignment={vertical:'middle',horizontal:align||(fmt&&fmt!==FMT.date?'right':'left')};
}
/* Tabla simple con fila de totales en fórmula */
function addTable(ws,row,col,spec){
  // spec: {title, headers, fmts, rows, totals:{label, cols:[idx...]} , widths}
  if(spec.title) row=sectionTitle(ws,row,col,spec.title,spec.headers.length);
  row=headRow(ws,row,col,spec.headers,spec.headHeight);
  const first=row;
  spec.rows.forEach((r,i)=>{
    r.forEach((v,j)=>{ const c=ws.getCell(row,col+j); c.value=v; styleData(c,spec.fmts[j],i%2===1); });
    row++;
  });
  if(!spec.rows.length){
    ws.mergeCells(row,col,row,col+spec.headers.length-1);
    const c=ws.getCell(row,col); c.value='Sin datos en este rango'; c.font={italic:true,size:10,color:{argb:XC.muted}}; c.alignment={horizontal:'center'}; row++;
  }
  if(spec.totals){
    const last=row-1;
    spec.headers.forEach((h,j)=>{
      const c=ws.getCell(row,col+j);
      if(j===0) c.value=spec.totals.label||'Total';
      else if(spec.totals.cols.indexOf(j)>=0){
        const L=colL(col+j); const res=spec.rows.reduce((a,r)=>a+(typeof r[j]==='number'?r[j]:0),0);
        c.value=spec.rows.length?{formula:`SUBTOTAL(9,${L}${first}:${L}${last})`,result:Math.round(res*100)/100}:0;
        c.numFmt=spec.fmts[j];
      }
      c.font={name:'Calibri',size:10,bold:true,color:{argb:XC.ink}}; c.fill=fill(XC.greenSoft);
      c.border={top:{style:'medium',color:{argb:XC.green}},bottom:{style:'medium',color:{argb:XC.green}},left:thin,right:thin};
      c.alignment={vertical:'middle',horizontal:j===0?'left':'right'};
    });
    ws.getRow(row).height=19; row++;
  }
  return row+1;
}

/* Hoja de detalle (ENVASES / LÍQUIDO) con subtotales por fecha */
function detalleSheet(wb,name,title,data,tab){
  const ws=newSheet(wb,name,tab);
  const H=['Fecha','Ruta','Conductor','Nombre del conductor','Referencia','IDMat','Material','Tipo pedido','N° pedido','Creado por','Uni.','Valor','Uni.','Valor','Uni.','Valor','Clase','Motivo','Comentario'];
  const W=[11,9,10,26,17,9,36,11,20,11,8,11,8,11,8,12,7,30,30];
  W.forEach((w,i)=>ws.getColumn(i+1).width=w);
  let row=titleBlock(ws,title,H.length);
  // resumen rápido
  const falt=data.reduce((a,p)=>a+(p.tv>0?p.tv:0),0), sobr=data.reduce((a,p)=>a+(p.tv<0?p.tv:0),0);
  const sin=data.filter(p=>!(getClase(p)||[])[0]).length;
  const kp=[['Faltante',falt,FMT.diff],['Sobrante',sobr,FMT.diff],['Neto',falt+sobr,FMT.diff],['Líneas',data.length,FMT.int],['Sin clasificar',sin,FMT.int]];
  kp.forEach((k,i)=>{
    const c1=ws.getCell(row,1+i*2), c2=ws.getCell(row+1,1+i*2);
    ws.mergeCells(row,1+i*2,row,2+i*2); ws.mergeCells(row+1,1+i*2,row+1,2+i*2);
    c1.value=k[0]; c1.font={size:9,color:{argb:XC.muted}}; c1.alignment={horizontal:'left'};
    c2.value=k[1]; c2.numFmt=k[2]; c2.font={size:13,bold:true,color:{argb:XC.ink}}; c2.alignment={horizontal:'left'};
  });
  ws.getRow(row+1).height=20;
  row+=3;
  // encabezado en dos niveles
  const g=row;
  for(let j=1;j<=H.length;j++){ const c=ws.getCell(g,j); c.fill=fill(XC.green); c.border=boxBorder; }
  [[11,12,'ZPD7'],[13,14,'ZPP4'],[15,16,'TOTAL']].forEach(([a,b,t])=>{
    ws.mergeCells(g,a,g,b); const c=ws.getCell(g,a); c.value=t; c.font={bold:true,size:10,color:{argb:XC.white}}; c.alignment={horizontal:'center'}; c.fill=fill(t==='TOTAL'?XC.amber:XC.green);
  });
  ws.getRow(g).height=17;
  row=headRow(ws,g+1,1,H,28);
  ws.getCell(g+1,15).fill=fill(XC.amber); ws.getCell(g+1,16).fill=fill(XC.amber);
  ws.views=[{state:'frozen',ySplit:g+1,xSplit:2,showGridLines:false}];
  ws.pageSetup.printTitlesRow=`${g}:${g+1}`;
  const firstData=row;
  const cmpS=(x,y)=>x<y?-1:x>y?1:0;
  const sorted=data.slice().sort((a,b)=>cmpS(a.fecha,b.fecha)||cmpS(a.ruta,b.ruta)||cmpS(a.cond,b.cond)||cmpS(a.ref,b.ref)||cmpS(a.mat,b.mat));
  const fm=[FMT.date,null,null,null,null,null,null,null,null,null,FMT.units,FMT.money,FMT.units,FMT.money,FMT.units,FMT.diff,null,null,null];
  const sums=[10,11,12,13,14,15];
  let i=0;
  while(i<sorted.length){
    const f=sorted[i].fecha; const start=row; let z=0; const acc=[0,0,0,0,0,0];
    while(i<sorted.length&&sorted[i].fecha===f){
      const p=sorted[i]; const cl=getClase(p)||['',''];
      const vals=[isoToDate(p.fecha),p.ruta,p.cond,p.nom,p.ref,p.idmat,p.mat,p.tuser,p.nroped,p.creado,p.du||0,p.dv||0,p.pu||0,p.pv||0,p.tu||0,p.tv||0,cl[0]?+cl[0]:null,cl[0]?motivoDe(cl[0]):'Sin clasificar',cl[1]||null];
      vals.forEach((v,j)=>{const c=ws.getCell(row,j+1); c.value=v; styleData(c,fm[j],z%2===1,j===16?'center':null);});
      ws.getCell(row,7).alignment={vertical:'middle',wrapText:false};
      if(!cl[0]){ const m=ws.getCell(row,18); m.font={italic:true,size:10,color:{argb:XC.amber}}; ws.getCell(row,17).fill=fill(XC.amberSoft); }
      acc[0]+=p.du;acc[1]+=p.dv;acc[2]+=p.pu;acc[3]+=p.pv;acc[4]+=p.tu;acc[5]+=p.tv;
      row++; i++; z++;
    }
    // subtotal del día
    ws.mergeCells(row,1,row,10);
    const lab=ws.getCell(row,1); lab.value=`Subtotal ${fmtDate(f)}  (${row-start} líneas)`;
    for(let j=1;j<=H.length;j++){
      const c=ws.getCell(row,j); c.fill=fill(XC.amberSoft); c.font={bold:true,size:10,color:{argb:XC.ink}};
      c.border={top:{style:'thin',color:{argb:XC.amber}},bottom:{style:'thin',color:{argb:XC.amber}}};
    }
    lab.alignment={horizontal:'right'};
    sums.forEach((j,k)=>{const L=colL(j+1); const c=ws.getCell(row,j+1); c.value={formula:`SUBTOTAL(9,${L}${start}:${L}${row-1})`,result:Math.round(acc[k]*100)/100}; c.numFmt=fm[j]; c.alignment={horizontal:'right'};});
    ws.getRow(row).outlineLevel=0;
    for(let r=start;r<row;r++) ws.getRow(r).outlineLevel=1;
    row++;
  }
  // total general
  if(sorted.length){
    ws.mergeCells(row,1,row,10);
    const lab=ws.getCell(row,1); lab.value=`TOTAL GENERAL  (${sorted.length} líneas)`;
    for(let j=1;j<=H.length;j++){ const c=ws.getCell(row,j); c.fill=fill(XC.green); c.font={bold:true,size:11,color:{argb:XC.white}}; }
    lab.alignment={horizontal:'right'};
    sums.forEach((j,k)=>{const L=colL(j+1); const c=ws.getCell(row,j+1);
      const res=sorted.reduce((a,p)=>a+[p.du,p.dv,p.pu,p.pv,p.tu,p.tv][k],0);
      c.value={formula:`SUBTOTAL(9,${L}${firstData}:${L}${row-1})`,result:Math.round(res*100)/100};
      c.numFmt=fm[j].replace('[Red]','[Color2]').replace('[Blue]','[Color2]'); c.alignment={horizontal:'right'};});
    ws.getRow(row).height=21;
  } else {
    ws.mergeCells(row,1,row,H.length); const c=ws.getCell(row,1); c.value='Sin líneas en este rango'; c.font={italic:true,color:{argb:XC.muted}};
  }
  return ws;
}

async function exportXlsx(){
  if(!S.meta.days.length){toast('Primero sube un archivo HELIO.');return;}
  busy('Armando el reporte en Excel…');
  let ExcelJS;
  try{ ExcelJS=await loadExcelJS(); }catch(e){ busy(); toast('No se pudo cargar el generador de Excel con formato; se exporta la versión simple.'); return exportXlsxBasic(); }
  try{
    const wb=new ExcelJS.Workbook(); wb.creator='Diferencias HELIO'; wb.created=new Date();
    const env=S.env, liq=S.liq;
    const eF=sumBy(env,p=>p.tv>0?p.tv:0), eS=sumBy(env,p=>p.tv<0?p.tv:0), lF=sumBy(liq,p=>p.tv>0?p.tv:0), lS=sumBy(liq,p=>p.tv<0?p.tv:0);
    const frAll=porFechaRuta(env), fr=frAll.filter(o=>o.monto>0.004), sobr=frAll.filter(o=>o.monto<-0.004);
    let pagT=0; fr.forEach(o=>pagT+=getPagado(o.fecha,o.ruta)||0); const monT=fr.reduce((a,o)=>a+o.monto,0);

    /* ---- Hoja RESUMEN ---- */
    const ws=newSheet(wb,'Resumen',XC.green,false);
    ws.getColumn(1).width=2; [18,16,16,16,16,16,16].forEach((w,i)=>ws.getColumn(i+2).width=w);
    let row=titleBlock(ws,'Reporte de diferencias de líquido y envases',7,2);
    // Indicadores
    row=sectionTitle(ws,row,2,'Indicadores del periodo',7);
    row=headRow(ws,row,2,['Concepto','Faltante','Sobrante','Neto','','',''],20);
    for(let j=6;j<=8;j++){ ws.getCell(row-1,j).fill=fill(XC.white); ws.getCell(row-1,j).border={}; }
    [['Envases',eF,eS],['Líquido',lF,lS]].forEach((r,i)=>{
      [r[0],r[1],r[2],{formula:`C${row}+D${row}`,result:Math.round((r[1]+r[2])*100)/100}].forEach((v,j)=>{const c=ws.getCell(row,2+j);c.value=v;styleData(c,j?FMT.diff:null,i%2===1);});
      row++;
    });
    ['Total',{formula:`SUM(C${row-2}:C${row-1})`,result:eF+lF},{formula:`SUM(D${row-2}:D${row-1})`,result:eS+lS},{formula:`SUM(E${row-2}:E${row-1})`,result:eF+eS+lF+lS}].forEach((v,j)=>{
      const c=ws.getCell(row,2+j); c.value=v; c.numFmt=j?FMT.diff:undefined; c.font={bold:true,size:10}; c.fill=fill(XC.greenSoft);
      c.border={top:{style:'medium',color:{argb:XC.green}},bottom:{style:'medium',color:{argb:XC.green}},left:thin,right:thin}; c.alignment={horizontal:j?'right':'left'};});
    row+=2;
    const sinE=env.filter(p=>!(getClase(p)||[])[0]).length, sinL=liq.filter(p=>!(getClase(p)||[])[0]).length;
    row=addTable(ws,row,2,{title:'Pago de envases',headers:['Concepto','Monto'],fmts:[null,FMT.money],
      rows:[['Monto por pagar',Math.round(monT*100)/100],['Pagado',Math.round(pagT*100)/100],['Pendiente',Math.round((monT-pagT)*100)/100]]});
    row=addTable(ws,row,2,{title:'Control de clasificación',headers:['Detalle','Líneas','Sin clasificar','Avance'],fmts:[null,FMT.int,FMT.int,'0%'],
      rows:[['Envases',env.length,sinE,env.length?(env.length-sinE)/env.length:1],['Líquido',liq.length,sinL,liq.length?(liq.length-sinL)/liq.length:1]]});
    // por ruta
    const rutas=new Map(); const addR=(r,k,v)=>{r=r||'(sin ruta)';let o=rutas.get(r);if(!o){o={eF:0,eS:0,lq:0,m:0,p:0};rutas.set(r,o);}o[k]+=v;};
    env.forEach(p=>addR(p.ruta,p.tv>0?'eF':'eS',p.tv)); liq.forEach(p=>addR(p.ruta,'lq',p.tv));
    fr.forEach(o=>{addR(o.ruta,'m',o.monto);addR(o.ruta,'p',getPagado(o.fecha,o.ruta)||0);});
    const rr=[...rutas.entries()].sort((a,b)=>a[0]<b[0]?-1:1).map(([r,o])=>[r,o.eF,o.eS,o.eF+o.eS,o.lq,o.p,o.m-o.p].map(v=>typeof v==='number'?Math.round(v*100)/100:v));
    row=addTable(ws,row,2,{title:'Diferencias por ruta',headers:['Ruta','Envases faltante','Envases sobrante','Envases neto','Líquido neto','Envases pagado','Pendiente de pago'],
      fmts:[null,FMT.diff,FMT.diff,FMT.diff,FMT.diff,FMT.money,FMT.diff],rows:rr,totals:{cols:[1,2,3,4,5,6]}});
    // por motivo
    const mot=new Map(); const addM=(p,k)=>{const c=(getClase(p)||[])[0]||'';const key=c||'zz';let o=mot.get(key);if(!o){o={c,n:c?(motivoDe(c)||'Clase '+c):'Sin clasificar',e:0,l:0,ne:0,nl:0};mot.set(key,o);}o[k]+=p.tv;o[k==='e'?'ne':'nl']++;};
    env.forEach(p=>addM(p,'e')); liq.forEach(p=>addM(p,'l'));
    const mm=[...mot.values()].sort((a,b)=>(a.c===''?1:0)-(b.c===''?1:0)||(+a.c)-(+b.c)).map(o=>[o.c?+o.c:'–',o.n,o.ne,Math.round(o.e*100)/100,o.nl,Math.round(o.l*100)/100,Math.round((o.e+o.l)*100)/100]);
    row=addTable(ws,row,2,{title:'Diferencias por motivo',headers:['Clase','Motivo','Líneas envases','Envases','Líneas líquido','Líquido','Total'],
      fmts:[FMT.int,null,FMT.int,FMT.diff,FMT.int,FMT.diff,FMT.diff],rows:mm,totals:{label:'Total',cols:[2,3,4,5,6]}});
    // por día
    const days=new Map(); env.forEach(p=>{const o=days.get(p.fecha)||{e:0,l:0};o.e+=p.tv;days.set(p.fecha,o);}); liq.forEach(p=>{const o=days.get(p.fecha)||{e:0,l:0};o.l+=p.tv;days.set(p.fecha,o);});
    const dd=[...days.entries()].sort((a,b)=>a[0]<b[0]?-1:1).map(([f,o])=>[isoToDate(f),Math.round(o.e*100)/100,Math.round(o.l*100)/100,Math.round((o.e+o.l)*100)/100]);
    row=addTable(ws,row,2,{title:'Diferencias por día',headers:['Fecha','Envases','Líquido','Total'],fmts:[FMT.date,FMT.diff,FMT.diff,FMT.diff],rows:dd,totals:{cols:[1,2,3]}});
    const note=ws.getCell(row,2); ws.mergeCells(row,2,row,8);
    note.value='Positivo = faltante (rojo); negativo = sobrante (azul). ZPP4 toma el Importe y ZPD7 el S_Importe en negativo.';
    note.font={italic:true,size:9,color:{argb:XC.muted}};

    /* ---- Detalles ---- */
    detalleSheet(wb,'Envases','Detalle de diferencias de envases',env,XC.amber);
    detalleSheet(wb,'Líquido','Detalle de diferencias de líquido',liq,XC.blue);

    /* ---- Envases pagados ---- */
    const wp=newSheet(wb,'Envases pagados',XC.amber,false);
    wp.getColumn(1).width=2; [13,11,15,15,15,13].forEach((w,i)=>wp.getColumn(i+2).width=w);
    let r2=titleBlock(wp,'Control de pago de envases',6,2);
    r2=sectionTitle(wp,r2,2,'Pagos por día y ruta',6);
    r2=headRow(wp,r2,2,['Fecha','Ruta','Monto','Pagado','Pendiente','Estado'],22);
    wp.views=[{state:'frozen',ySplit:r2-1,showGridLines:false}]; wp.pageSetup.printTitlesRow=`${r2-1}:${r2-1}`;
    const pf=r2;
    fr.forEach((o,i)=>{
      const pg=getPagado(o.fecha,o.ruta)||0; const pend=Math.round((o.monto-pg)*100)/100;
      const est=pend<=0.004?'Pagado':(pg>0?'Parcial':'Pendiente');
      const vals=[isoToDate(o.fecha),o.ruta,o.monto,pg,{formula:`D${r2}-E${r2}`,result:pend},est];
      const fmts=[FMT.date,null,FMT.money,FMT.money,FMT.diff,null];
      vals.forEach((v,j)=>{const c=wp.getCell(r2,2+j);c.value=v;styleData(c,fmts[j],i%2===1,j===5?'center':null);});
      const ce=wp.getCell(r2,7); ce.font={bold:true,size:10,color:{argb:est==='Pagado'?XC.green:est==='Parcial'?XC.amber:XC.red}};
      r2++;
    });
    if(fr.length){
      ['TOTAL','',{formula:`SUBTOTAL(9,D${pf}:D${r2-1})`,result:Math.round(monT*100)/100},{formula:`SUBTOTAL(9,E${pf}:E${r2-1})`,result:Math.round(pagT*100)/100},{formula:`SUBTOTAL(9,F${pf}:F${r2-1})`,result:Math.round((monT-pagT)*100)/100},''].forEach((v,j)=>{
        const c=wp.getCell(r2,2+j);c.value=v;c.numFmt=j>=2&&j<=4?(j===4?FMT.diff:FMT.money):undefined;c.font={bold:true,size:10};c.fill=fill(XC.greenSoft);
        c.border={top:{style:'medium',color:{argb:XC.green}},bottom:{style:'medium',color:{argb:XC.green}},left:thin,right:thin};c.alignment={horizontal:j<2?'left':'right'};});
      wp.getColumn(7).width=12;
      r2+=2;
    } else r2+=1;
    const byR=new Map(); fr.forEach(o=>{const x=byR.get(o.ruta)||{m:0,p:0};x.m+=o.monto;x.p+=getPagado(o.fecha,o.ruta)||0;byR.set(o.ruta,x);});
    r2=addTable(wp,r2,2,{title:'Resumen por ruta',headers:['Ruta','Días con faltante','Monto','Pagado','Pendiente'],fmts:[null,FMT.int,FMT.money,FMT.money,FMT.diff],
      rows:[...byR.entries()].sort().map(([rt,x])=>[rt,fr.filter(o=>o.ruta===rt).length,Math.round(x.m*100)/100,Math.round(x.p*100)/100,Math.round((x.m-x.p)*100)/100]),totals:{cols:[1,2,3,4]}});
    r2=addTable(wp,r2,2,{title:'Sobrantes por día y ruta (no se pagan)',headers:['Fecha','Ruta','Monto'],fmts:[FMT.date,null,FMT.diff],
      rows:sobr.map(o=>[isoToDate(o.fecha),o.ruta,o.monto]),totals:{cols:[2]}});

    /* ---- Motivos ---- */
    const wm=newSheet(wb,'Motivos',XC.muted,false);
    wm.getColumn(1).width=2; [9,42].forEach((w,i)=>wm.getColumn(i+2).width=w);
    let r3=titleBlock(wm,'Tabla de motivos (clases)',2,2);
    addTable(wm,r3,2,{headers:['Clase','Motivo'],fmts:[FMT.int,null],rows:S.anexos.map(a=>[+a.c,a.t])});

    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const emp=S.config.empresa&&S.config.empresa!=='*'?S.config.empresa.split(' ').slice(0,2).join(' ')+' ':'';
    const name=`Reporte diferencias ${emp}${fmtDate(S.f.from).replace(/\//g,'-')} al ${fmtDate(S.f.to).replace(/\//g,'-')}.xlsx`;
    busy();
    await deliverFile(name,blob);
  }catch(e){
    busy(); console.error(e); toast('No se pudo armar el reporte: '+(e&&e.message?e.message:e));
  }
}
async function deliverFile(name,blob){
  let dl=null;
  try{ if(window.claude&&typeof window.claude.use==='function') dl=await window.claude.use('downloads'); }catch(e){}
  if(dl){
    try{ await dl.save({filename:name,data:blob}); toast('Reporte exportado.'); }
    catch(e){ if(e&&e.code!=='declined') toast('No se pudo descargar el Excel en esta vista.'); }
    return;
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

/* ===================== Eventos ===================== */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{S.view=t.dataset.view;render();});
$('btnUploadTop').onclick=pickFile;
$('fileIn').onchange=e=>handleFiles(e.target.files);
$('btnExport').onclick=exportXlsx;
$('fEmp').onchange=async e=>{S.config.empresa=e.target.value;saveConfig().catch(()=>{});await recompute();};
$('fPer').onchange=async e=>{
  S.f.per=e.target.value;
  const c=cyclesAvailable().find(x=>x.id===S.f.per);
  if(c){S.f.from=c.start;S.f.to=c.end;$('fFrom').value=c.start;$('fTo').value=c.end;}
  await recompute();
};
const onRange=async()=>{S.f.from=$('fFrom').value;S.f.to=$('fTo').value;S.f.per='custom';$('fPer').value='custom';if(S.f.from&&S.f.to)await recompute();};
$('fFrom').onchange=onRange; $('fTo').onchange=onRange;
$('fRuta').onchange=async e=>{S.f.ruta=e.target.value;await recompute();};
$('fUser').onchange=async e=>{S.f.user=e.target.value;await recompute();};
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{ if(!e.target.closest('#drop')){ e.preventDefault(); if(e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);} });

(async function start(){
  render();
  await Store.init();
  $('storeBadge').textContent=Store.mode==='cloud'?'Guardado en tu cuenta':Store.mode==='local'?'Guardado en este navegador':'Sin guardado';
  try{ await loadBase(); }catch(e){ toast('No se pudieron leer los datos guardados.'); }
  fillFilters();
  if(!S.meta.days.length) S.view='helio';
  busy(S.meta.days.length?'Cargando datos…':''); 
  try{ await recompute(); }catch(e){ toast('No se pudieron cargar algunos días.'); }
  busy();
})();

</script>
